services:
  db:
    image: postgres:15.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exacontrol
    ports:
      - "5432:5432"
    volumes:
      - exacontrol_pgdata:/var/lib/postgresql/data

volumes:
  exacontrol_pgdata:
