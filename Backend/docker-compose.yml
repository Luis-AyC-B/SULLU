services:
  db:
    image: postgres:15.10
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exacontrol
    ports:
      - "5432:5432"
    volumes:
      - exacontrol_pgdata:/var/lib/postgresql/data

  backups:
    image: postgres:15.10
    profiles: [backups]
    restart: unless-stopped
    depends_on:
      - db
    environment:
      PGHOST: ${BACKUP_PGHOST:-db}
      PGPORT: ${BACKUP_PGPORT:-5432}
      PGUSER: ${BACKUP_PGUSER:-postgres}
      PGPASSWORD: ${BACKUP_PGPASSWORD:-postgres}
      PGDATABASE: ${BACKUP_PGDATABASE:-exacontrol}
      PGSSLMODE: ${BACKUP_PGSSLMODE:-prefer}
      BACKUP_INTERVAL_SECONDS: 86400
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - exacontrol_backups:/backups
      - ./ops:/ops:ro
    entrypoint:
      - sh
      - -c
      - >-
        tr -d '\r' < /ops/backup.sh > /tmp/hu21-backup.sh &&
        exec sh /tmp/hu21-backup.sh "$$@"
      - hu21-backup

volumes:
  exacontrol_pgdata:
  exacontrol_backups:
